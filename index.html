<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css?v=8">
    <title>Countdown Game</title>
<body>
    <div>
        <h2>Countdown</h2>
        <div>
            <input id="seed" type="text" placeholder="Number/letter inputs here" size="50">
                &nbsp; <button>Go</button>
                <button id="show-answers-button">Show answers</button>
                <button id="reset-button">Reset</button>
        </div>
        <div>
            Letters - Vowels: 
            <button class="vowels">3</button>
            <button class="vowels">4</button>
            <button class="vowels">5</button>
            <button id="conundrum-button">Conundrum</button>
        </div>
        <div>
            Numbers - Large:
            <button class="large">0</button>
            <button class="large">1</button>
            <button class="large">2</button>
            <button class="large">3</button>
            <button class="large">4</button>
        </div>
        <div>
            <input id="suggest" type="text" placeholder="Try">
            <button>Check</button>
        </div>
        <div id="check-suggestion"></div>
        <button id="conundrum-clue" style="visibility:hidden;">Conundrum Clue</button>
        <div id="answer"></div><br>

        <div>
            <hr>
            <p class="text-center">Modified version of <a href="https://incoherency.co.uk/countdown/practice/">Countdown game</a> by <a href="https://github.com/pal-saugstad/countdown-game/blob/master/README.md">Pål Saugstad</a>
            &nbsp; &nbsp; &nbsp; Origin: Countdown game by <a href="https://incoherency.co.uk/">James Stanley</a>.</p>
            <hr>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dictionary.js"></script>
    <script src="dictionary-stats.js?v=1.1"></script>
    <script src="letters.js?v=1.4"></script>
    <script src="cntdn.js?v=1.5"></script>
    <script src="conundrum.js?v=1.0"></script>
    <script src="conundrum2.js?v=1.2"></script>
    <script src="practice.js?v=1.5"></script>


</html>
